<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Página inicial do projeto Sidia">
	<title>Sidia</title>
	<style>
		:root {
			font-family: Arial, sans-serif;
			color: #1f2937;
			background: #f3f4f6;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}

		header {
			padding: 1rem 5%;
			background: #111827;
			color: #fff;
		}

		nav {
			max-width: 1100px;
			margin: 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		nav a { color: #fff; text-decoration: none; }

		main {
			flex: 1;
			width: min(1100px, 90%);
			margin: 0 auto;
			padding: 5rem 0;
			text-align: center;
		}

		h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin-bottom: 1rem; }
		p { color: #4b5563; font-size: 1.1rem; }

		.botao {
			display: inline-block;
			margin-top: 1.5rem;
			padding: .8rem 1.4rem;
			border-radius: .5rem;
			background: #2563eb;
			color: #fff;
			text-decoration: none;
		}

		footer { padding: 1rem; text-align: center; background: #e5e7eb; }
	</style>
</head>
<body>
	<header>
		<nav aria-label="Navegação principal">
			<strong>Sidia</strong>
			<a href="#sobre">Sobre</a>
            <P>c'eest le primeire modification</P>  
		</nav>
	</header>

	<main id="sobre">
		<h1>Bem-vindo ao seu novo projeto</h1>
		<p>Este é o ponto de partida para construir algo incrível.</p>
		<a class="botao" href="#comecar">Começar agora</a>
	</main>

	<footer id="comecar">
		<small>&copy; 2024 Sidia. Todos os direitos reservados.</small>
	</footer>
</body>
</html>
